language = "C"
include_guard = "APPLE_PLATFORM_H"
autogen_warning = "/* Generated by cbindgen from crates/apple-platform-ffi. Do not edit by hand; regenerate with `just header`. */"
include_version = false
cpp_compat = true
documentation = true
usize_is_size_t = true
sys_includes = ["stdint.h", "stddef.h"]
no_includes = false

[parse]
parse_deps = false

[fn]
sort_by = "None"

[export]
# The ABI surface is exactly what lib.rs + abi.rs define; nothing from
# upstream crates leaks into the header.
exclude = []
