[workspace]
members = ["crates/apple-platform-ffi"]
# The vendored upstream workspace is built via path dependencies, not as members.
exclude = ["crates/apple-platform-rs"]
resolver = "2"

[workspace.package]
edition = "2021"
# Matches upstream apple-codesign 0.29.0. Revisit on upstream bumps (main is at 1.92).
rust-version = "1.81"
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
# "debuginfo", never "symbols": the cdylib's dynamic exports must survive.
strip = "debuginfo"
# catch_unwind at the FFI boundary requires unwinding panics.
panic = "unwind"
